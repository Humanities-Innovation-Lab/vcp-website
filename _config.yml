# Site settings
title: Visionary Cross Project
email:
description: >- # this means to ignore newlines until "baseurl:"
  A digital edition of the Anglo-Saxon monuments of the Visionary Cross group,
  including the Ruthwell and Bewcastle crosses and the Brussels Cross. The
  project brings high-resolution imaging together with editions of the
  monuments' texts and ornament.

# If this deploys as a GitHub Pages project site, these are the right values.
# Change baseurl to "" and url to the custom domain if it gets one.
baseurl: "/vcp-website"
url: "https://humanities-innovation-lab.github.io"

github_username: Humanities-Innovation-Lab

# Build settings
theme: minima
plugins:
  - jekyll-feed

